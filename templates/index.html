<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>
<body>
    <h1>My Todo List</h1>

    <form method="POST" action="/add">
        <input type="text" name="title" placeholder="Enter a new todo..." required>
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for todo in todos %}
        <li>
            <a href="/toggle/{{ todo.id }}">
                {% if todo.done %}[x]{% else %}[ ]{% endif %}
            </a>
            <span class="{% if todo.done %}done{% endif %}">{{ todo.title }}</span>
            <a href="/delete/{{ todo.id }}" class="delete">Delete</a>
        </li>
        {% endfor %}
    </ul>

    {% if not todos %}
    <p>No todos yet. Add one above!</p>
    {% endif %}
</body>
</html>
